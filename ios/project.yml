name: NodexGuest
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  NodexGuest:
    type: application
    platform: iOS
    sources:
      - NodexGuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nodexlm.ios.guest
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: NodexGuest/NativeBridge.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/native"
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/native/libNodexGo.a"
          - "$(PROJECT_DIR)/native/libNodexGGML.a"
          - "-lc++"
          - "-framework"
          - Metal
          - "-framework"
          - MetalKit
          - "-framework"
          - Accelerate
          - "-framework"
          - Security
          - "-framework"
          - SystemConfiguration
          - "-framework"
          - CoreFoundation
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos
