[package]
name = "nodexlm-rpc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nodexlm_rpc"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
libc = "0.2"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
socket2 = "0.6"
tokio = { version = "=1.49.0", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
