name: Android UI checks

# Kotlin/resources validation on Android UI PRs only; avoid compiling native
# llama.cpp and packaging both ABIs for a UI-only change.
on:
  pull_request:
    paths:
      - 'android/app/src/main/java/**/*.kt'
      - 'android/app/src/main/res/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/android-ui-checks.yml'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/android-public-download.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK for Kotlin UI/resources
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Validate APK rebuild and release provenance contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/android-apk.yml').read_text()
          release=Path('.github/workflows/android-public-download.yml').read_text()
          for marker in (
            "'android/**'",
            "git diff --name-only HEAD^ HEAD -- android/",
            "scripts/native-revision-changed.py",
            ".github/workflows/android-apk.yml",
            ":app:assembleDebug",
            "name: nodexlm-android-debug",
            "arm64-v8a",
            "armeabi-v7a",
          ):
            if marker not in workflow:
              raise SystemExit(f'APK workflow missing required trigger/build contract: {marker}')
          for marker in (
            'dist/BUILD_INFO.txt',
            'source_commit=',
            'android_workflow_run=',
            "steps.download.outputs.available == 'true'",
          ):
            if marker not in release:
              raise SystemExit(f'Public APK release missing provenance/guard: {marker}')
          PY

      - name: Validate launcher icon contract
        run: python3 scripts/check-android-launcher.py
      - name: Compile Android resources, Kotlin UI and unit tests
        working-directory: android
        run: gradle --no-daemon --max-workers=2 :app:processDebugResources :app:compileDebugKotlin :app:testDebugUnitTest
