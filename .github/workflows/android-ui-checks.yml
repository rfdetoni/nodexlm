name: Android UI checks

# Kotlin/resources validation on Android UI PRs only; avoid compiling native
# llama.cpp and packaging both ABIs for a UI-only change.
on:
  pull_request:
    paths:
      - 'android/app/src/main/java/**/*.kt'
      - 'android/app/src/test/**'
      - 'android/app/src/main/res/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle.kts'
      - 'android/signing-certificate.sha256'
      - '.github/workflows/android-ui-checks.yml'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/android-public-download.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/android-changes"
            if grep -Eq '^(android/app/src/main/cpp/|android/rpc-rust/|android/([^/]+/)*build\.gradle\.kts$|android/settings\.gradle\.kts$|android/gradle\.properties$|internal/llamaruntime/(revision\.json|patches/(unix-rpc|arm32-rpc-wire)\.patch)$|scripts/(apply-rpc-patch\.cmake|verify-android-pages\.sh|fetch-android-tokenizer\.py)$|\.github/workflows/android-apk\.yml$)' "$RUNNER_TEMP/android-changes"; then skip=true; fi
          fi
          echo "full_apk=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.scope.outputs.full_apk != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.scope.outputs.full_apk != 'true'
        with:
          packages: 'platform-tools'
      - name: Install SDK for Kotlin UI/resources
        if: steps.scope.outputs.full_apk != 'true'
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.full_apk != 'true'
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Validate APK rebuild and release provenance contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/android-apk.yml').read_text()
          release=Path('.github/workflows/android-public-download.yml').read_text()
          for marker in (
            "'android/**'",
            "git diff --name-only HEAD^ HEAD -- android/",
            "scripts/native-revision-changed.py",
            ".github/workflows/android-apk.yml",
            ":app:assembleDebug",
            ":app:assembleRelease",
            "name: nodexlm-android-pr-test-only",
            "name: nodexlm-android-updatable",
            "signing-certificate.sha256",
            "ANDROID_KEYSTORE_BASE64",
            "apksigner",
            "arm64-v8a",
            "armeabi-v7a",
            "libnodexlm_rpc.so",
          ):
            if marker not in workflow:
              raise SystemExit(f'APK workflow missing required trigger/build contract: {marker}')
          if workflow.index("Prepare permanent Android signing") > workflow.index("Install pinned Android SDK"):
            raise SystemExit("Signing preflight must precede expensive SDK setup")
          if "name: nodexlm-android-debug" in workflow:
            raise SystemExit("Public unsigned APK artifact must not be produced")
          for marker in (
            'dist/BUILD_INFO.txt',
            'source_commit=',
            'android_workflow_run=',
            'build_variant=',
            'certificate_sha256=',
            'nodexlm-android-debug',
            'nodexlm-android-updatable',
            'signing-certificate.sha256',
            'apksigner',
            "run_branch",
            "run_id <= previous",
            "steps.download.outputs.available == 'true'",
          ):
            if marker not in release:
              raise SystemExit(f'Public APK release missing provenance/guard: {marker}')
          PY

      - name: Validate launcher icon contract
        run: python3 scripts/check-android-launcher.py
      - name: Compile Android resources, Kotlin UI and unit tests
        if: steps.scope.outputs.full_apk != 'true'
        working-directory: android
        run: gradle --no-daemon --max-workers=2 :app:processDebugResources :app:compileDebugKotlin :app:testDebugUnitTest
