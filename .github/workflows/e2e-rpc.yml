name: Real RPC end-to-end

# Explicit dispatch keeps native model tests out of routine PR/build minutes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-rpc.yml', 'scripts/test-console.cjs', 'internal/dashboard/static/styles.css', 'internal/llamaruntime/revision.json', 'internal/local/managed.go', 'internal/pairing/**', 'scripts/hardware-acceptance.py', 'internal/openai/**', 'internal/dashboard/openai.go', 'internal/dashboard/handler.go', 'internal/local/openai.go', 'scripts/test-openai-sdk.py']
permissions:
  contents: read
concurrency:
  group: nodexlm-real-rpc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distributed:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download pinned native runtime and tiny test model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          revision=json.loads(pathlib.Path('internal/llamaruntime/revision.json').read_text())
          downloads=[
              ('rpc.tar.gz',f'https://github.com/rfdetoni/nodexlm/releases/download/{revision["rpc_release"]}/nodexlm-rpc_{revision["version"]}_linux_amd64_cpu.tar.gz',revision['published']['linux/amd64/cpu']),
              ('tiny.gguf','https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf','270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d')]
          for name,url,digest in downloads:
              with urllib.request.urlopen(url,timeout=60) as response:
                  data=response.read(64*1024*1024+1)
              assert len(data)<=64*1024*1024 and hashlib.sha256(data).hexdigest()==digest,name
              pathlib.Path(name).write_bytes(data)
          PY
          mkdir native
          tar --no-same-owner -xzf rpc.tar.gz -C native
          go build -o nodexlm ./cmd/nodexlm
      - name: Real LAN multicast discovery
        run: NODEXLM_TEST_MDNS=1 go test ./internal/mdns -run TestLANMulticastDiscovery -count=1 -timeout=15s
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Pair real Guest, place model layers and stream tokens
        env:
          NODEXLM_RPC_DIR: ${{ github.workspace }}/native
          NODEXLM_TEST_MODEL: ${{ github.workspace }}/tiny.gguf
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
          NODEXLM_UI_CHECK: ${{ github.workspace }}/scripts/test-console.cjs
        run: python3 scripts/e2e-rpc.py
      - name: Official OpenAI SDK chat and agent acceptance
        env:
          NODEXLM_RPC_DIR: ${{ github.workspace }}/native
          NODEXLM_TEST_MODEL: ${{ runner.temp }}/agent-acceptance.gguf
          NODEXLM_TEST_EMBEDDING: ${{ runner.temp }}/embedding-acceptance.gguf
        run: |
          python3 -m pip install --quiet --target "$RUNNER_TEMP/openai-sdk" openai==3.46.0 openai-agents==0.24.0
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,urllib.request
          downloads=[
              ('NODEXLM_TEST_MODEL','https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf','74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'),
              ('NODEXLM_TEST_EMBEDDING','https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/bert-bge-small/ggml-model-f16.gguf','f0b2fef971e8366438bfd2d9aefea1b0115919389448806d290237f638bae999')]
          for variable,url,expected in downloads:
              path=pathlib.Path(os.environ[variable]);digest=hashlib.sha256()
              with urllib.request.urlopen(url,timeout=90) as response,path.open('wb') as target:
                  while data:=response.read(1024*1024):
                      digest.update(data);target.write(data)
                      assert target.tell()<=512*1024*1024
              assert digest.hexdigest()==expected
          PYCODE
          PYTHONPATH="$RUNNER_TEMP/openai-sdk" python3 scripts/test-openai-sdk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-browser-screenshots
          path: ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7
