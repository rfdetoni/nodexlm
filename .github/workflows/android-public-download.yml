name: Android APK - Public Download

# Reuse the release-signed Android build rather than compiling again.
# Legacy debug filename/tag are retained for existing in-app download URLs.
# The APK is the non-debuggable, permanently signed release variant.
on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Android APK workflow run ID (blank = latest successful run)'
        type: string
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: nodexlm-public-android-updatable
  cancel-in-progress: false

jobs:
  publish:
    name: Public Android 10+ test APK
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout certificate policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download APK from successful Android build
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          AUTOMATIC_EVENT: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            # Manual invocation: locate the newest non-expired permanently signed APK artifact.
            run_id="$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and .name == "nodexlm-android-updatable")] | .[0].workflow_run.id // empty')"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::No signed Android APK build artifact available"
            exit 1
          fi
          run_status="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          if [[ "$run_status" != "success" ]]; then
            echo "::error::Android APK run $run_id did not succeed"
            exit 1
          fi
          run_branch="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_branch')"
          if [[ "$run_branch" != "main" ]]; then
            echo "::error::Refusing to publish an Android APK not built on main"
            exit 1
          fi
          updatable="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "nodexlm-android-updatable" and .expired == false)] | length')"
          debug="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select((.name == "nodexlm-android-debug" or .name == "nodexlm-android-pr-test-only") and .expired == false)] | length')"
          if [[ "$updatable" -gt 0 ]]; then
            artifact_name="nodexlm-android-updatable"
            variant="release"
            signature="permanent"
          elif [[ "$debug" -gt 0 ]]; then
            echo "::error::Refusing to replace the permanently signed beta with an incompatible debug APK"
            exit 1
          elif [[ "$AUTOMATIC_EVENT" == "true" ]]; then
            echo "No APK artifact in run $run_id (native/launcher unchanged); skipping public release without rebuilding."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::Successful run $run_id does not contain a signed Android APK artifact"
            exit 1
          fi
          source_sha="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha')"
          version_code="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.run_number')"
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing monotonically increasing Android versionCode"
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Android build source commit could not be verified"
            exit 1
          fi
          # workflow_run events can arrive out of order. Never replace a
          # newer installed beta with an older versionCode on the public URL.
          if gh release view android-debug --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir -p dist/previous
            if gh release download android-debug --repo "$GH_REPO" --pattern BUILD_INFO.txt --dir dist/previous >/dev/null 2>&1; then
              previous="$(sed -n 's/^android_workflow_run=//p' dist/previous/BUILD_INFO.txt)"
              previous_code="$(sed -n 's/^version_code=//p' dist/previous/BUILD_INFO.txt)"
              if [[ "$previous" =~ ^[0-9]+$ ]] && ((run_id <= previous)); then
                echo "Newer or equal Android run $previous is already published; skipping stale run $run_id."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [[ "$previous_code" =~ ^[0-9]+$ ]] && ((version_code <= previous_code)); then
                echo "Newer or equal versionCode $previous_code is already published; skipping stale versionCode $version_code."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          mkdir -p dist
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir dist
          shopt -s nullglob
          apks=(dist/NodexLM-android-universal.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK in the successful Android artifact"
            exit 1
          fi
          mv "${apks[0]}" dist/NodexLM-android10-plus-debug.apk
          apk="dist/NodexLM-android10-plus-debug.apk"
          test -s "$apk"
          apk_entries="$(unzip -Z1 "$apk")"
          for abi in armeabi-v7a arm64-v8a; do
            for lib in libnodexlm.so libnodexlm_rpc.so libdjl_tokenizer.so libonnxruntime.so libonnxruntime4j_jni.so; do
              grep -Fqx "lib/${abi}/${lib}" <<< "$apk_entries" || {
                echo "::error::APK is missing ${abi}/${lib}"
                exit 1
              }
            done
          done
          for lib in libggml.so libggml-base.so libllama.so libggml-vulkan.so \
            libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so \
            libggml-cpu-android_armv8.2_2.so libggml-cpu-android_armv8.6_1.so \
            libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so \
            libggml-cpu-android_armv9.2_2.so; do
            grep -Fqx "lib/arm64-v8a/${lib}" <<< "$apk_entries" || {
              echo "::error::APK is missing arm64-v8a/${lib}"
              exit 1
            }
          done
          sdk_bt="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          if [[ -x "$sdk_bt/35.0.0/apksigner" && -x "$sdk_bt/35.0.0/aapt" ]]; then
            tools="$sdk_bt/35.0.0"
          else
            tools="$(find "$sdk_bt" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [[ -z "$tools" || ! -x "$tools/apksigner" || ! -x "$tools/aapt" ]]; then
            echo "::error::Android build-tools (apksigner/aapt) unavailable on runner"
            exit 1
          fi
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -Fq "sdkVersion:'29'" <<< "$badging"
          if grep -Fq "application-debuggable" <<< "$badging"; then
            echo "::error::Refusing to publish a debuggable APK"
            exit 1
          fi
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          [[ "$package_line" == *"name='dev.nodexlm.app'"* && "$package_line" == *"versionCode='${version_code}'"* ]] || {
            echo "::error::APK applicationId or versionCode mismatch"
            exit 1
          }
          expected="$(tr -d '[:space:]' < android/signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/public-cert-info.txt"
          actual="$(grep -iE 'Signer #1.*certificate SHA-256 digest:' "$RUNNER_TEMP/public-cert-info.txt" | head -n 1 | awk '{print tolower($NF)}' | tr -d '\r')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            cat "$RUNNER_TEMP/public-cert-info.txt" || true
            echo "::error::Refusing to publish APK signed with unexpected certificate ($actual != $expected)"
            exit 1
          fi
          (cd dist && sha256sum NodexLM-android10-plus-debug.apk > SHA256SUMS.txt)
          {
            echo "source_commit=$source_sha"
            echo "android_workflow_run=$run_id"
            echo "package=NodexLM-android10-plus-debug.apk"
            echo "build_variant=$variant"
            echo "signature=$signature"
            echo "version_code=$version_code"
            echo "version_name=0.1.0-ci.${version_code}"
            echo "certificate_sha256=$expected"
            echo "min_sdk=29"
            echo "abis=armeabi-v7a,arm64-v8a"
          } > dist/BUILD_INFO.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Published permanently signed Android APK from source commit \`$source_sha\`, build run $run_id, versionCode $version_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish downloadable APK in public GitHub prerelease
        if: steps.download.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANT: ${{ steps.download.outputs.variant }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" != "release" ]]; then
            echo "::error::Only permanently signed release variants may be published"
            exit 1
          fi
          tag="android-debug"
          files=(dist/NodexLM-android10-plus-debug.apk dist/SHA256SUMS.txt dist/BUILD_INFO.txt)
          title='NodexLM Android 10+ - Beta assinada'
          note='APK beta universal ARMv7/ARM64 para Android 10+, compilado como release e assinado com a mesma identidade permanente das releases oficiais. O nome do arquivo -debug foi mantido somente para preservar URLs de versões antigas. APKs anteriores assinados com chave debug temporária exigem migração única (faça backup antes de desinstalar); após isso, a atualização poderá ocorrer sem reinstalação. Não instalar builds debug dos jobs de CI.'
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$tag" --repo "$GH_REPO" --title "$title" --notes "$note" --prerelease --latest=false
          else
            gh release create "$tag" "${files[@]}" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$note" \
              --prerelease --latest=false
          fi
          echo "Download público: https://github.com/$GH_REPO/releases/download/$tag/NodexLM-android10-plus-debug.apk" >> "$GITHUB_STEP_SUMMARY"
