name: Android APK - Public Download

# Reuse a successful Android build instead of recompiling native llama.cpp.
# Publish an openly downloadable testing APK for Android 10+ sideload users.
on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Android APK workflow run ID (blank = latest successful run)'
        type: string
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: nodexlm-public-android-debug
  cancel-in-progress: false

jobs:
  publish:
    name: Public Android 10+ test APK
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from successful Android build
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          AUTOMATIC_EVENT: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            # Manual invocation: locate the newest non-expired debug artifact,
            # not merely a successful run whose build job was skipped.
            run_id="$(gh api "repos/$GH_REPO/actions/artifacts?name=nodexlm-android-debug&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | .[0].workflow_run.id // empty')"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::No Android APK build artifact available"
            exit 1
          fi
          run_status="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          if [[ "$run_status" != "success" ]]; then
            echo "::error::Android APK run $run_id did not succeed"
            exit 1
          fi
          available="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "nodexlm-android-debug" and .expired == false)] | length')"
          if [[ "$available" -eq 0 && "$AUTOMATIC_EVENT" == "true" ]]; then
            echo "No APK artifact in run $run_id (native/launcher unchanged); skipping public release without rebuilding."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$available" -eq 0 ]]; then
            echo "::error::Specified successful run $run_id has no debug APK"
            exit 1
          fi
          mkdir -p dist
          gh run download "$run_id" --repo "$GH_REPO" --name nodexlm-android-debug --dir dist
          shopt -s nullglob
          apks=(dist/*-debug.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one APK in the successful Android artifact"
            exit 1
          fi
          mv "${apks[0]}" dist/NodexLM-android10-plus-debug.apk
          test -s dist/NodexLM-android10-plus-debug.apk
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 dist/NodexLM-android10-plus-debug.apk | grep -Fqx "lib/${abi}/libnodexlm.so" || {
              echo "::error::APK is missing the ${abi} native library"
              exit 1
            }
          done
          (cd dist && sha256sum NodexLM-android10-plus-debug.apk > SHA256SUMS.txt)
          source_sha="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Android build source commit could not be verified"
            exit 1
          fi
          {
            echo "source_commit=$source_sha"
            echo "android_workflow_run=$run_id"
            echo "package=NodexLM-android10-plus-debug.apk"
            echo "min_sdk=29"
            echo "abis=armeabi-v7a,arm64-v8a"
          } > dist/BUILD_INFO.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Published Android APK from source commit \`$source_sha\`, build run $run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish downloadable APK in public GitHub prerelease
        if: steps.download.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="android-debug"
          files=(dist/NodexLM-android10-plus-debug.apk dist/SHA256SUMS.txt dist/BUILD_INFO.txt)
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title 'NodexLM Android 10+ - APK de teste' \
              --notes 'APK universal ARMv7/ARM64 para Android 10+. Instalação direta, sem Play Store. Versão de teste assinada com chave debug gerada no CI, que pode mudar entre compilações: pode ser necessário desinstalar a versão anterior, perdendo os dados locais. Para atualizações sem desinstalação utilize versões oficiais assinadas sempre com a mesma chave.' \
              --prerelease --latest=false
          fi
          echo "Download público: https://github.com/$GH_REPO/releases/download/$tag/NodexLM-android10-plus-debug.apk" >> "$GITHUB_STEP_SUMMARY"
