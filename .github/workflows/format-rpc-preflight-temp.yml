name: Format RPC preflight (temporary)
on:
  push:
    branches: [fix/rpc-hello-preflight-and-chat-deadlines]
    paths: ['.github/workflows/format-rpc-preflight-temp.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rfdetoni/nodexlm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: Format Go changes
        shell: bash
        run: |
          set -euo pipefail
          files=(internal/rpcmesh/probe.go internal/rpcmesh/probe_test.go internal/dashboard/manager.go internal/dashboard/rpc_preflight.go internal/dashboard/rpc_preflight_test.go internal/dashboard/chat.go internal/local/llama.go internal/local/managed.go internal/local/llama_test.go)
          gofmt -w "${files[@]}"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'style: gofmt inference deadline and RPC preflight changes'
            git push origin HEAD:fix/rpc-hello-preflight-and-chat-deadlines
          fi
