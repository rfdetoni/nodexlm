name: Reconcile RPC fix with main (temporary)
on:
  push:
    branches: [fix/rpc-layer-transfer-stall-diagnostics]
    paths: ['.github/workflows/reconcile-rpc-main-temp.yml']
permissions:
  contents: write
jobs:
  merge:
    if: github.repository == 'rfdetoni/nodexlm' && github.ref == 'refs/heads/fix/rpc-layer-transfer-stall-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Detect conflicts (do not push when conflicted)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "scripts/test-dashboard-models.cjs" ]]; then
              printf 'Unexpected conflicts, refusing integration: %s\n' "${conflicts[*]}"
              exit 1
            fi
            # Prefer latest main regression suite, then restore this PR's
            # isolated RPC stall test without dropping mistral.rs tests.
            git checkout --theirs scripts/test-dashboard-models.cjs
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('scripts/test-dashboard-models.cjs')
          source=subprocess.check_output(['git','show','HEAD:scripts/test-dashboard-models.cjs'],text=True)
          first='  const stalledLoad={settings:{model:'
          end='  // The pairing code is not an admin session token.'
          if first not in source or end not in source: raise SystemExit('RPC test block not found in branch')
          block=source[source.index(first):source.index(end,source.index(first))]
          merged=path.read_text()
          if 'mistral.rs should clear RPC distribution' not in merged: raise SystemExit('Mistral tests lost')
          if 'const stalledLoad=' not in merged:
              if end not in merged: raise SystemExit('Pairing test anchor missing')
              merged=merged.replace(end,block+end,1)
          path.write_text(merged)
          PY
            git add scripts/test-dashboard-models.cjs
          fi
          gofmt -w internal/rpcmesh/hub.go
          git add internal/rpcmesh/hub.go
          # Do not silently drop features introduced after this PR branched.
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'internal/dashboard/manager.go':['Backend: s.Backend','rpcStatsProvider','loadRPCNodes','m.loadRPCBaseline'],
            'internal/dashboard/static/app.js':['renderNodeResources','pairingTick','runtimeBackend','rpc-stall-warning'],
            'cmd/nodexlm/main.go':['RPCIdleNodes','mistralrs-bin','SetRPCStatsProvider'],
            'internal/rpcmesh/hub.go':['BytesToGuest','IdleNodes','bridgeTracked'],
            'internal/local/backend.go':['BackendMistralRS'],
          }
          for path,markers in checks.items():
            source=Path(path).read_text()
            for marker in markers:
              if marker not in source:
                raise SystemExit(f'Feature missing: {path} {marker}')
          PY
          git commit -m 'merge: preserve mistral.rs while reconciling RPC stall diagnostics'
          git push origin HEAD:fix/rpc-layer-transfer-stall-diagnostics
