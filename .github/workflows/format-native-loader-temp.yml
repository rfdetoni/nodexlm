name: Format native loader fixes (temporary)
on:
  push:
    branches: [fix/ggml-loader-and-rpc-startup-logging]
    paths: ['.github/workflows/format-native-loader-temp.yml']
permissions:
  contents: write
jobs:
  gofmt:
    if: github.repository == 'rfdetoni/nodexlm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: Format loader, managed process and load tracing
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/llamaruntime/native_environment.go
            internal/llamaruntime/native_environment_test.go
            internal/llamaruntime/patch.go
            internal/llamaruntime/install.go
            internal/local/managed.go
            internal/dashboard/manager.go
          )
          gofmt -w "${files[@]}"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'style: gofmt verified GGML loader and diagnostic changes'
            git push origin HEAD:fix/ggml-loader-and-rpc-startup-logging
          fi
