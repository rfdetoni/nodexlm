name: Android APK

# Manual builds do not burn Actions minutes on every commit.
# Version tags publish signed APKs directly in GitHub Releases; no Play Store.
on:
  workflow_dispatch:
  push:
    # Validate workflow edits without running CI on every application commit.
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      # Build only when the startup/update code changes; no CI on unrelated commits.
      - 'android/app/src/main/java/dev/nodexlm/app/UpdateManager.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/MainActivity.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/HuggingFaceHub.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/ModelFiles.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/ModelLibraryView.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/PairingClient.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/ComputeService.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/RpcGuestService.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/NativeRpc.kt'
      - 'android/app/src/main/cpp/native.cpp'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/dev/nodexlm/app/RpcGuestService.kt'
      - 'android/app/src/main/java/dev/nodexlm/app/NativeRpc.kt'
    tags:
      - 'v*'

concurrency:
  group: nodexlm-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Android 10+ universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      NDK_VERSION: '27.2.12479018'
      ANDROID_BUILD_TOOLS: '35.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # The removed legacy SDK 'tools' package breaks setup-android@v3.
          packages: 'platform-tools'

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      # This repository deliberately does not commit a Gradle wrapper JAR.
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Determine APK version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            [[ "$name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || exit 1
          else
            name="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing (required on tags)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]] && count=$((count + 1))
          done
          if [[ "$count" -eq 4 ]]; then
            path="$RUNNER_TEMP/nodexlm-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
            chmod 600 "$path"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          elif [[ "$count" -ne 0 || "$GITHUB_REF" == refs/tags/* ]]; then
            echo '::error::Set all four Android signing secrets for tag releases: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.'
            exit 1
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PnodexVersionName='${{ steps.version.outputs.name }}' \
            -PnodexVersionCode='${{ steps.version.outputs.code }}' \
            :app:assembleDebug

      - name: Verify debug APK and native library
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$apk" | grep -Fqx "lib/${abi}/libnodexlm.so" || { echo "::error::Missing $abi native library"; exit 1; }
          done
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | grep -Fq "sdkVersion:'29'"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/NodexLM-${{ steps.version.outputs.name }}-android10-plus-debug.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS-debug.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-android-debug
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        shell: bash
        env:
          NODEXLM_ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          NODEXLM_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NODEXLM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NODEXLM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PnodexVersionName='${{ steps.version.outputs.name }}' \
            -PnodexVersionCode='${{ steps.version.outputs.code }}' \
            :app:assembleRelease

      - name: Verify signed release APK and package it
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$apk" | grep -Fqx "lib/${abi}/libnodexlm.so" || { echo "::error::Missing $abi native library"; exit 1; }
          done
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | grep -Fq "sdkVersion:'29'"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          cp "$apk" dist/NodexLM-android-universal.apk
          (cd dist && sha256sum NodexLM-android-universal.apk > SHA256SUMS.txt)

      - name: Build update manifest for direct Android updates
        if: steps.signing.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          import hashlib, json, os, pathlib
          apk = pathlib.Path('dist/NodexLM-android-universal.apk')
          sha = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}/{apk.name}"
          info = {'schema': 1, 'versionCode': int(os.environ['VERSION_CODE']), 'versionName': os.environ['VERSION_NAME'], 'sha256': sha, 'apkUrl': url}
          pathlib.Path('dist/update.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          PYUPDATE

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-android-release
          path: |
            dist/NodexLM-android-universal.apk
            dist/SHA256SUMS.txt
            dist/update.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed APK to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: nodexlm-android-release
          path: release

      - name: Publish APK (stable or prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/NodexLM-android-universal.apk release/SHA256SUMS.txt release/update.json)
          for file in "${files[@]}"; do test -s "$file"; done
          # Semver release tags such as v1.0.0 are stable and appear at
          # /releases/latest; v1.0.0-rc.1 remains a prerelease.
          options=(--title "NodexLM ${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${options[@]}"
          fi
