name: Android APK

# Android packages need to be rebuilt when their *application sources* change,
# including Kotlin, JNI/CMake, Gradle and launcher resources. Skip only changes
# unrelated to Android and published RPC checksum metadata.
# A successful full APK is published by android-public-download.yml.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'android/app/src/main/cpp/**'
      - 'android/rpc-rust/**'
      - 'android/**/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/gradle.properties'
      - 'internal/llamaruntime/revision.json'
      - 'internal/llamaruntime/patches/unix-rpc.patch'
      - 'internal/llamaruntime/patches/arm32-rpc-wire.patch'
      - 'scripts/apply-rpc-patch.cmake'
      - 'scripts/verify-android-pages.sh'
      - 'scripts/fetch-android-tokenizer.py'
      - 'scripts/native-revision-changed.py'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'internal/llamaruntime/revision.json'
      - 'internal/llamaruntime/patches/unix-rpc.patch'
      - 'internal/llamaruntime/patches/arm32-rpc-wire.patch'
      - 'scripts/apply-rpc-patch.cmake'
      - 'scripts/verify-android-pages.sh'
      - 'scripts/fetch-android-tokenizer.py'
      - 'scripts/native-revision-changed.py'
      - '.github/workflows/android-apk.yml'
    tags:
      - 'v*'

concurrency:
  group: nodexlm-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  detect:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.native.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - id: native
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "changed=$(python3 scripts/native-revision-changed.py --android-pr)" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            native="$(python3 scripts/native-revision-changed.py --android)"
            app_changes="$(git diff --name-only HEAD^ HEAD -- android/ internal/llamaruntime/patches/unix-rpc.patch internal/llamaruntime/patches/arm32-rpc-wire.patch scripts/apply-rpc-patch.cmake scripts/verify-android-pages.sh scripts/fetch-android-tokenizer.py scripts/native-revision-changed.py .github/workflows/android-apk.yml)"
            if [[ "$native" == "true" || -n "$app_changes" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              {
                echo '### Android APK build requested'
                echo 'App, build configuration, JNI, or pinned native runtime changed.'
                echo "Source commit: \`$GITHUB_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              {
                echo '### Android APK unchanged: build skipped'
                echo 'Only published native-checksum metadata changed; no Android rebuild needed.'
                echo "Source commit: \`$GITHUB_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    name: Android 10+ universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      NDK_VERSION: '27.2.12479018'
      ANDROID_BUILD_TOOLS: '35.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare permanent Android signing (required on main and tags)
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Signed Android APK builds are permitted only on main or v* tags (ref: $GITHUB_REF)."
            exit 1
          fi
          count=0
          for secret in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$secret" ]] && count=$((count + 1))
          done
          if [[ "$count" -ne 4 ]]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for signed beta and tagged releases.'
            exit 1
          fi
          path="$RUNNER_TEMP/nodexlm-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          test -s "$path"
          expected="$(tr -d '[:space:]' < android/signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::android/signing-certificate.sha256 is invalid or missing.'
            exit 1
          fi
          checker="$RUNNER_TEMP/VerifyKeystore.java"
          cat <<'JAVA' > "$checker"
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.cert.Certificate;
          public final class VerifyKeystore {
              public static void main(String[] args) throws Exception {
                  String path = System.getenv("KS_PATH");
                  String storePass = System.getenv("STORE_PASSWORD");
                  String alias = System.getenv("KEY_ALIAS");
                  String keyPass = System.getenv("KEY_PASSWORD");
                  String expected = System.getenv("EXPECTED_SHA");
                  KeyStore ks = KeyStore.getInstance("JKS");
                  try (FileInputStream in = new FileInputStream(path)) {
                      ks.load(in, storePass.toCharArray());
                  }
                  if (!ks.containsAlias(alias)) {
                      throw new IllegalStateException("Missing keystore alias");
                  }
                  Key key = ks.getKey(alias, keyPass.toCharArray());
                  if (key == null) {
                      throw new IllegalStateException("Unable to unlock private key");
                  }
                  Certificate cert = ks.getCertificate(alias);
                  if (cert == null) {
                      throw new IllegalStateException("Missing certificate for alias");
                  }
                  byte[] digest = MessageDigest.getInstance("SHA-256").digest(cert.getEncoded());
                  StringBuilder hex = new StringBuilder(64);
                  for (byte b : digest) {
                      hex.append(String.format("%02x", b & 0xff));
                  }
                  if (!expected.equals(hex.toString())) {
                      throw new IllegalStateException("Keystore certificate SHA-256 mismatch: " + hex);
                  }
              }
          }
          JAVA
          trap 'rm -f "$checker"' EXIT
          KS_PATH="$path" EXPECTED_SHA="$expected" java "$checker"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # The removed legacy SDK 'tools' package breaks setup-android@v3.
          packages: 'platform-tools'

      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      # This repository deliberately does not commit a Gradle wrapper JAR.
      - name: Vulkan shader compiler for ARM64 Android
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc spirv-headers libvulkan-dev ccache
          command -v glslc
      - name: Configure bounded native compiler cache
        shell: bash
        run: |
          ccache --set-config=cache_dir="$HOME/.cache/nodexlm-ccache"
          ccache --set-config=max_size=768M
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          {
            echo "CCACHE_DIR=$HOME/.cache/nodexlm-ccache"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nodexlm-ccache
          key: android-native-v1-${{ runner.os }}-ndk27-${{ hashFiles('internal/llamaruntime/revision.json', 'internal/llamaruntime/patches/unix-rpc.patch', 'internal/llamaruntime/patches/arm32-rpc-wire.patch', 'android/app/src/main/cpp/**', 'android/app/build.gradle.kts', 'scripts/apply-rpc-patch.cmake') }}
          restore-keys: |
            android-native-v1-${{ runner.os }}-ndk27-
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Rust RPC tests (PR, signed beta and tags)
        working-directory: android/rpc-rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          test -s Cargo.lock
          cargo +1.94.0 test --locked
          bash -n build-android.sh
          bash -n ../../scripts/android-rpc-acceptance.sh
      - name: Preserve resolved Rust dependency lock for review
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-rust-rpc-dependency-lock
          path: android/rpc-rust/Cargo.lock
          if-no-files-found: ignore
      - name: Model, updater and energy policy unit tests
        working-directory: android
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Determine APK version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            [[ "$name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || exit 1
          else
            name="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Prefetch pinned llama.cpp once for both ABIs
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json; print(json.load(open("internal/llamaruntime/revision.json"))["commit"])')"
          mirror="$RUNNER_TEMP/llamacpp.git"
          rm -rf "$mirror"
          git init --bare "$mirror"
          git -C "$mirror" fetch --depth 1 https://github.com/ggml-org/llama.cpp.git "${commit}:refs/heads/pinned"
          git -C "$mirror" symbolic-ref HEAD refs/heads/pinned
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.file://${mirror}.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/ggml-org/llama.cpp.git"
          } >> "$GITHUB_ENV"

      - name: Build debug APK (PR only)
        if: github.event_name == 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PnodexVersionName='${{ steps.version.outputs.name }}' \
            -PnodexVersionCode='${{ steps.version.outputs.code }}' \
            -PnodexRustRpc='true' \
            -PnodexKleidiAi='true' \
            :app:assembleDebug

      - name: Verify debug APK and native library
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          apk_entries="$(unzip -Z1 "$apk")"
          for abi in armeabi-v7a arm64-v8a; do
            for lib in libnodexlm.so libnodexlm_rpc.so libdjl_tokenizer.so libonnxruntime.so libonnxruntime4j_jni.so; do
              grep -Fqx "lib/${abi}/${lib}" <<< "$apk_entries" || { echo "::error::Missing $abi/$lib"; exit 1; }
            done
          done
          for lib in libggml.so libggml-base.so libllama.so libggml-vulkan.so \
            libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so \
            libggml-cpu-android_armv8.2_2.so libggml-cpu-android_armv8.6_1.so \
            libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so \
            libggml-cpu-android_armv9.2_2.so; do
            grep -Fqx "lib/arm64-v8a/${lib}" <<< "$apk_entries" || { echo "::error::Missing arm64-v8a/${lib}"; exit 1; }
          done
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | grep -Fq "sdkVersion:'29'"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify "$apk"
          bash scripts/verify-android-pages.sh "$apk"
          mkdir -p dist
          cp "$apk" "dist/NodexLM-${{ steps.version.outputs.name }}-android10-plus-debug.apk"
          sha256sum dist/*-debug.apk > dist/SHA256SUMS-debug.txt
          echo "PR debug APK compiled and verified from \`$GITHUB_SHA\` (ARMv7 + ARM64, minSdk 29)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload isolated PR test APK (not update-compatible)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-android-pr-test-only
          path: |
            dist/*-debug.apk
            dist/SHA256SUMS-debug.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        working-directory: android
        shell: bash
        env:
          NODEXLM_ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.path }}
          NODEXLM_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NODEXLM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NODEXLM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 \
            -PnodexVersionName='${{ steps.version.outputs.name }}' \
            -PnodexVersionCode='${{ steps.version.outputs.code }}' \
            -PnodexRustRpc='true' \
            -PnodexKleidiAi='true' \
            :app:assembleRelease

      - name: Verify permanent APK identity and package update
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apk_entries="$(unzip -Z1 "$apk")"
          for abi in armeabi-v7a arm64-v8a; do
            for lib in libnodexlm.so libnodexlm_rpc.so libdjl_tokenizer.so libonnxruntime.so libonnxruntime4j_jni.so; do
              grep -Fqx "lib/${abi}/${lib}" <<< "$apk_entries" || { echo "::error::Release APK is missing ${abi}/${lib}"; exit 1; }
            done
          done
          for lib in libggml.so libggml-base.so libllama.so libggml-vulkan.so \
            libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so \
            libggml-cpu-android_armv8.2_2.so libggml-cpu-android_armv8.6_1.so \
            libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so \
            libggml-cpu-android_armv9.2_2.so; do
            grep -Fqx "lib/arm64-v8a/${lib}" <<< "$apk_entries" || { echo "::error::Release APK is missing arm64-v8a/${lib}"; exit 1; }
          done
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          badging="$("$tools/aapt" dump badging "$apk")"
          echo "$badging" | grep -Fq "sdkVersion:'29'"
          if echo "$badging" | grep -Fq "application-debuggable"; then
            echo "::error::Release APK must not be debuggable"
            exit 1
          fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/nodexlm-cert-info.txt"
          expected="$(tr -d '[:space:]' < android/signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/nodexlm-cert-info.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::Android update certificate differs from the pinned permanent certificate. Refusing to distribute an incompatible APK."
            exit 1
          fi
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          [[ "$package_line" == *"name='dev.nodexlm.app'"* && "$package_line" == *"versionCode='${{ steps.version.outputs.code }}'"* ]] || {
            echo "::error::Android application ID/versionCode mismatch"
            exit 1
          }
          bash scripts/verify-android-pages.sh "$apk"
          mkdir -p dist
          cp "$apk" dist/NodexLM-android-universal.apk
          (cd dist && sha256sum NodexLM-android-universal.apk > SHA256SUMS-android.txt)
          echo "Verified permanent Android certificate ${expected}, versionCode ${{ steps.version.outputs.code }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload updatable Android APK for public beta
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-android-updatable
          path: dist/NodexLM-android-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build update manifest for direct Android updates
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          import hashlib, json, os, pathlib
          apk = pathlib.Path('dist/NodexLM-android-universal.apk')
          sha = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          cert = pathlib.Path('android/signing-certificate.sha256').read_text(encoding='utf-8').strip().lower()
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}/{apk.name}"
          info = {'schema': 1, 'versionCode': int(os.environ['VERSION_CODE']), 'versionName': os.environ['VERSION_NAME'], 'sha256': sha, 'certificateSha256': cert, 'apkUrl': url}
          pathlib.Path('dist/update.json').write_text(json.dumps(info, indent=2) + '\n', encoding='utf-8')
          PYUPDATE

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nodexlm-android-release
          path: |
            dist/NodexLM-android-universal.apk
            dist/SHA256SUMS-android.txt
            dist/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Native compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      - name: Remove temporary signing keys and prefetch mirror
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/nodexlm-release.jks" "$RUNNER_TEMP/nodexlm-cert-info.txt" "$RUNNER_TEMP/VerifyKeystore.java" "$RUNNER_TEMP/llamacpp.git"

  publish:
    name: Publish signed APK to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nodexlm-android-release
          path: release

      - name: Publish APK (stable or prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/NodexLM-android-universal.apk release/SHA256SUMS-android.txt release/update.json)
          for file in "${files[@]}"; do test -s "$file"; done
          # Semver release tags such as v1.0.0 are stable and appear at
          # /releases/latest; v1.0.0-rc.1 remains a prerelease.
          options=(--title "NodexLM ${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${options[@]}"
          fi
