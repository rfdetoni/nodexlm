name: Merge main into telemetry PR (temporary)
on:
  push:
    branches: [feat/live-node-resources]
    paths:
      - '.github/workflows/merge-main-telemetry-temp.yml'
permissions:
  contents: write
jobs:
  merge:
    if: github.repository == 'rfdetoni/nodexlm' && github.ref == 'refs/heads/feat/live-node-resources'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate latest main while retaining both feature sets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "merge: integrate adaptive inference before live resource monitoring"
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "internal/dashboard/static/index.html": ["flashAttention", "kvCache", "nodeResourceCards"],
              "internal/dashboard/static/app.js": ["flashAttention", "kvCache", "renderNodeResources"],
              "cmd/nodexlm/main.go": ["rpc-cache", "15 * time.Second"],
              "internal/dashboard/manager.go": ["FlashAttention", "KVCache"],
              "internal/coordinator/server.go": ["validUsage", "CPUUsagePercent"],
          }
          for path, values in checks.items():
              data = Path(path).read_text()
              for value in values:
                  if value not in data:
                      raise SystemExit(f"Lost critical feature {value} in {path}; refusing push.")
          PY
          git push origin HEAD:feat/live-node-resources
