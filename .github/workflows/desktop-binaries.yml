name: Desktop and CLI binaries

# A single cross-compilation job creates reusable executables for all platforms.
# 'edge' is publicly downloadable without a version tag; stable tags are optional.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-binaries.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/test-dashboard-models.cjs'
      - 'scripts/test-install.sh'
      - 'scripts/sbom.py'
      - 'scripts/package-*.py'
      - 'scripts/sign-windows.ps1'
      - 'scripts/finalize-release.py'
      - 'install.sh'
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nodexlm-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      windows-signing: ${{ steps.signing.outputs.configured }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate production signing configuration
        id: signing
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$PFX" && -n "$PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PFX" || -n "$PASSWORD" || "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Production Windows releases require WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD from a trusted Code Signing certificate.'
            exit 1
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Determine release version
        id: version
        run: |
          version="0.1.0-edge.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Go tests and vet (Linux Guest metrics, CLI and Host)
        run: |
          go test ./...
          go vet ./...
      - name: Dashboard model list regression test
        run: |
          node --check internal/dashboard/static/app.js
          node scripts/test-dashboard-models.cjs
          go test ./internal/dashboard
      - name: POSIX installer smoke test
        run: sh ./scripts/test-install.sh
      - name: Smoke test public Linux RPC shared libraries
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          url='https://github.com/rfdetoni/nodexlm/releases/download/nodexlm-rpc-b12143-r2/nodexlm-rpc_b12143_linux_amd64_cpu.tar.gz'
          curl -fsSL --retry 3 "$url" -o "$runtime_dir/rpc.tar.gz"
          mkdir "$runtime_dir/payload"
          tar -xzf "$runtime_dir/rpc.tar.gz" -C "$runtime_dir/payload"
          rpc="$runtime_dir/payload/bin/ggml-rpc-server"
          test -x "$rpc"
          # Pinned GGML may be fully static. Missing shared libraries are
          # determined by the dynamic loader, not by requiring libggml.so.0.
          LD_LIBRARY_PATH="$runtime_dir/payload/bin" ldd "$rpc" | tee "$runtime_dir/dependencies.log"
          if grep -Fq 'not found' "$runtime_dir/dependencies.log"; then
            echo "::error::Published RPC bundle has missing ELF shared libraries"
            exit 1
          fi
      - name: Native packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Cross compile and package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          mkdir -p dist stage
          for target in linux_amd64 linux_arm64 linux_armv7 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            os="${target%%_*}"
            arch="${target#*_}"
            goarch="$arch"
            goarm=''
            if [[ "$arch" == armv7 ]]; then goarch=arm; goarm=7; fi
            exe=nodexlm
            if [[ "$os" == windows ]]; then exe=nodexlm.exe; fi
            rm -rf stage/*
            CGO_ENABLED=0 GOOS="$os" GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags="-s -w -X main.version=$version" -o "stage/$exe" ./cmd/nodexlm
            cp LICENSE stage/LICENSE
            if [[ "$os" == windows ]]; then
              (cd stage && zip -q "../dist/nodexlm_${target}.zip" "$exe" LICENSE)
            else
              (cd stage && tar -czf "../dist/nodexlm_${target}.tar.gz" "$exe" LICENSE)
            fi
          done
          for target in linux_amd64 linux_arm64 linux_armv7; do
            arch="${target#linux_}"; if [[ "$arch" == armv7 ]]; then arch=armhf; fi
            mkdir -p "packages/$target"
            tar -xzf "dist/nodexlm_${target}.tar.gz" -C "packages/$target"
            python3 scripts/package-native.py --binary "packages/$target/nodexlm" --version "$version" --arch "$arch" --format deb --output dist
            python3 scripts/package-native.py --binary "packages/$target/nodexlm" --version "$version" --arch "$arch" --format rpm --output dist
          done
          (cd dist && sha256sum nodexlm_* nodexlm-*.rpm > SHA256SUMS.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$version" != *-* ]]; then
            python3 scripts/package-manifests.py --version "$version" --checksums dist/SHA256SUMS.txt --output manifests
            tar -czf dist/nodexlm-registry-manifests.tar.gz -C manifests .
            (cd dist && sha256sum nodexlm-registry-manifests.tar.gz >> SHA256SUMS.txt)
          fi
          test "$(find dist -name 'nodexlm_*.tar.gz' -o -name 'nodexlm_*.zip' | wc -l)" -eq 7
          cat dist/SHA256SUMS.txt
          python3 scripts/sbom.py --directory dist --version "$version" --commit "$GITHUB_SHA" --go-version "$(go env GOVERSION)"
      - name: Attest release binaries (SLSA provenance)
        if: steps.signing.outputs.configured != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nodexlm-desktop-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish public release assets
        if: steps.signing.outputs.configured != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='nodexlm-edge'
          flags=(--prerelease --latest=false)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            flags=(--latest)
            if [[ "$tag" == *-* ]]; then flags=(--prerelease --latest=false); fi
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" dist/* --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --title "NodexLM $tag" \
              --notes 'CLI and embedded headless Web console for Linux, macOS and Windows. Platform-native llama.cpp runtime is provisioned when needed. Checksums are in SHA256SUMS.txt. For permanent upgrades use the same release channel.' \
              "${flags[@]}"
          fi

  sign-windows:
    name: Sign Windows executables before publication
    needs: build-release
    if: needs.build-release.outputs.windows-signing == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: nodexlm-desktop-binaries, path: dist}
      - name: Import identity, sign and verify Windows binaries
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'nodexlm-signing.pfx'
          $identities = @()
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $identities = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $signers = @($identities | Where-Object { $_.HasPrivateKey })
            if ($signers.Count -ne 1) { throw 'Exactly one Code Signing private identity is required.' }
            ./scripts/sign-windows.ps1 -Directory dist -CertificateThumbprint $signers[0].Thumbprint
          } finally {
            foreach ($certificate in $identities) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Refresh checksums, SBOM and registry manifests
        shell: bash
        run: |
          version='${{ needs.build-release.outputs.version }}'
          args=(--directory dist)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then args+=(--stable-version "$version"); fi
          python scripts/finalize-release.py "${args[@]}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: {subject-path: 'dist/*'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: nodexlm-desktop-signed, path: 'dist/*', retention-days: 14}
      - name: Publish signed release assets
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -euo pipefail
          tag=nodexlm-edge
          flags=(--prerelease --latest=false)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; flags=(--latest)
            if [[ "$tag" == *-* ]]; then flags=(--prerelease --latest=false); fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NodexLM $tag" --notes 'Windows executables are Authenticode signed and timestamped. Final archives, packages, checksums and SBOM are attested after signing.' "${flags[@]}"
          fi
