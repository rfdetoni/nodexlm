name: Format alternate backend changes (temporary)
on:
  push:
    branches: [feat/experimental-mistralrs-runtime]
    paths: ['.github/workflows/format-mistralrs-temp.yml']
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: Format only new Go source
        shell: bash
        run: |
          set -euo pipefail
          files=(internal/local/backend.go internal/local/backend_test.go internal/local/managed.go internal/local/stream.go internal/local/openai.go internal/dashboard/manager.go internal/dashboard/benchmark.go internal/dashboard/selection_test.go)
          gofmt -w "${files[@]}"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'style: gofmt experimental inference backend'
            git push origin HEAD:feat/experimental-mistralrs-runtime
          fi
