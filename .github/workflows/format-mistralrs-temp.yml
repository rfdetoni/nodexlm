name: Format experimental engine CLI
on:
  push:
    branches: [feat/experimental-mistralrs-runtime]
    paths: ['.github/workflows/format-mistralrs-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/nodexlm/main.go internal/local/backend.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cmd/nodexlm/main.go internal/local/backend.go
            git commit -m 'style: gofmt experimental local CLI'
            git push origin HEAD:feat/experimental-mistralrs-runtime
          fi
