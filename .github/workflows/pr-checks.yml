name: PR Go checks

# Test only when Go code, module/toolchain or the check itself changes.
# Avoid running all-platform builds or publishing releases on pull requests.
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/llamaruntime/revision.json'
      - 'internal/dashboard/static/**'
      - 'scripts/**'
      - 'install.sh'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-pr-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files needing gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go test -race ./... -timeout 120s
      - run: node --check internal/dashboard/static/app.js && node scripts/test-dashboard-models.cjs
      - run: sh scripts/test-install.sh
      - run: go build -o nodexlm ./cmd/nodexlm && python3 scripts/smoke.py
      - run: go vet ./...

  windows-config:
    name: Windows secrets restart regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./internal/config -run 'TestEnsureSecretsPersistsAcrossRestarts|TestReadSecretsRejectsLooseUnixPermissions' -count=1
