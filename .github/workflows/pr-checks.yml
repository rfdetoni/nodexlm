name: PR Go checks

# Test only when Go code, module/toolchain or the check itself changes.
# Avoid running all-platform builds or publishing releases on pull requests.
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-pr-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

  windows-config:
    name: Windows secrets restart regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./internal/config -run 'TestEnsureSecretsPersistsAcrossRestarts|TestReadSecretsRejectsLooseUnixPermissions' -count=1
