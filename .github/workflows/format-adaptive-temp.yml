name: Format adaptive inference source (temporary)
on:
  push:
    branches:
      - feat/adaptive-inference-engine-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/adaptive-inference-engine-20261110
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format source and push corrections
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/nodexlm/main.go internal/clusterplan/adaptive.go internal/clusterplan/adaptive_test.go internal/dashboard/manager.go internal/dashboard/plan.go internal/dashboard/selection.go internal/dashboard/selection_test.go internal/dashboard/draft.go internal/dashboard/draft_test.go internal/dashboard/benchmark.go internal/local/managed.go internal/local/tuning_test.go internal/rpcmesh/run.go internal/rpcmesh/run_test.go internal/rpcmesh/run_unix.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'style: gofmt adaptive inference files'
            git push origin HEAD:feat/adaptive-inference-engine-20261110
          fi
