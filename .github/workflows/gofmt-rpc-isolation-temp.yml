name: Format RPC isolation (temporary)
on:
  push:
    branches: [fix/rpc-guest-isolation-and-native-stdout]
    paths: ['.github/workflows/gofmt-rpc-isolation-temp.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rfdetoni/nodexlm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          files=(cmd/nodexlm/main.go cmd/nodexlm/rpc_exclusions.go cmd/nodexlm/rpc_exclusions_test.go internal/local/managed.go)
          gofmt -w "${files[@]}"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'style: gofmt RPC Guest diagnostic changes'
            git push origin HEAD:fix/rpc-guest-isolation-and-native-stdout
          fi
