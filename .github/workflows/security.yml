name: Security checks

on:
  push:
    branches: [main]
    paths: ['**/*.go', 'go.mod', 'go.sum', 'android/**', '.github/workflows/**', 'scripts/**', 'internal/llamaruntime/**']
  pull_request:
    paths: ['**/*.go', 'go.mod', 'go.sum', 'android/**', '.github/workflows/**', 'scripts/**', 'internal/llamaruntime/**']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: nodexlm-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check dependencies for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Static analysis (scheduled or requested)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go vet ./...
