name: Trellis runtime candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/install-trellis-runtime.sh'
      - 'internal/llamaruntime/testdata/trellis-rpc-tensors.cpp'
      - 'internal/rpcmesh/probe.go'
      - 'internal/rpcmesh/trellis_candidate_test.go'
      - 'internal/llamaruntime/trellis*.go'
      - '.github/workflows/trellis-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-trellis-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate installer syntax before native compilation
        run: bash -n scripts/install-trellis-runtime.sh
      - name: Compile and validate isolated Trellis CPU RPC candidate
        shell: bash
        run: |
          export NODEXLM_HOME="$RUNNER_TEMP/trellis"
          export NODEXLM_TRELLIS_NATIVE=OFF
          bash scripts/install-trellis-runtime.sh cpu rpc-candidate
          candidate="$NODEXLM_HOME/runtimes/trellis/dc5521842f7991ceae73139f9d242d8f877e12d4/cpu-rpc-candidate/bin"
          test -x "$candidate/llama-server"
          test -x "$candidate/ggml-rpc-server"
      - name: Exercise NodexLM wire probes against compiled fork
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          export NODEXLM_TRELLIS_TEST_WORKER="$RUNNER_TEMP/trellis/runtimes/trellis/dc5521842f7991ceae73139f9d242d8f877e12d4/cpu-rpc-candidate/bin/ggml-rpc-server"
          go test ./internal/rpcmesh -run '^TestTrellisNativeCandidate$' -count=1 -v
