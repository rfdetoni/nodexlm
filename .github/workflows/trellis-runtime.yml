name: Trellis runtime candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/install-trellis-runtime.sh'
      - '.github/workflows/trellis-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodexlm-trellis-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile pinned isolated CPU runtime
        shell: bash
        run: |
          export NODEXLM_HOME="$RUNNER_TEMP/trellis"
          export NODEXLM_TRELLIS_NATIVE=OFF
          bash scripts/install-trellis-runtime.sh cpu
          test -x "$NODEXLM_HOME/runtimes/trellis/dc5521842f7991ceae73139f9d242d8f877e12d4/cpu/bin/llama-server"
