name: Portable RPC bundles
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/llamaruntime/revision.json'
      - 'internal/llamaruntime/patches/**'
      - '.github/workflows/rpc-platforms.yml'
  push:
    # Only rebuild native bundles when the pinned runtime/patch changes.
    # Full-PR diff filters would rebuild the five-platform matrix for
    # every subsequent frontend/Go edit, wasting Actions minutes.
    branches: [main]
    paths:
      - 'internal/llamaruntime/revision.json'
      - 'internal/llamaruntime/patches/**'
      - '.github/workflows/rpc-platforms.yml'
      - 'scripts/stage-rpc-bundle.py'
      - 'scripts/optimized-rpc-backend-search.patch'
permissions:
  contents: read
concurrency:
  group: nodexlm-rpc-platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.native.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - id: native
        shell: bash
        run: |
          # r2 is already immutable. Until its reviewed promotion sets the
          # next candidate tag, never build optimized binaries under r2.
          candidate=$(python3 -c 'import json; print(json.load(open("internal/llamaruntime/revision.json"))["rpc_candidate_release"])')
          if [[ "$candidate" == nodexlm-rpc-b12255-r2 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || [[ -n "$(git diff --name-only HEAD^ HEAD -- .github/workflows/rpc-platforms.yml scripts/stage-rpc-bundle.py scripts/optimized-rpc-backend-search.patch)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            previous=$(git show HEAD^:internal/llamaruntime/revision.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("rpc_candidate_release",""))')
            if [[ "$candidate" != "$previous" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=$(python3 scripts/native-revision-changed.py)" >> "$GITHUB_OUTPUT"
            fi
          fi
  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, os: linux, arch: amd64, backend: cpu}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, backend: cpu}
          - {runner: ubuntu-24.04, os: linux, arch: amd64, backend: vulkan}
          - {runner: macos-15, os: darwin, arch: arm64, backend: metal}
          - {runner: windows-latest, os: windows, arch: amd64, backend: cpu}
          - {runner: windows-latest, os: windows, arch: amd64, backend: vulkan}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Vulkan tools
        if: matrix.backend == 'vulkan' && matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers
      - name: Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk -or -not (Test-Path "$sdk\Bin\glslc.exe") -or -not (Test-Path "$sdk\Lib\vulkan-1.lib")) {
            throw "Vulkan SDK installation incomplete under C:\VulkanSDK"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Clang compiler (Linux ARM64 SME/KleidiAI)
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: Build pinned pair
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("internal/llamaruntime/revision.json"))["version"])')
          commit=$(python3 -c 'import json;print(json.load(open("internal/llamaruntime/revision.json"))["commit"])')
          git clone --quiet --depth 1 --branch "$version" https://github.com/ggml-org/llama.cpp.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "$commit"
          git -C upstream apply "$GITHUB_WORKSPACE/internal/llamaruntime/patches/unix-rpc.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/internal/llamaruntime/patches/arm32-rpc-wire.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/internal/llamaruntime/patches/parallel-rpc-loader.patch"
          git -C upstream apply --check "$GITHUB_WORKSPACE/scripts/optimized-rpc-backend-search.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/scripts/optimized-rpc-backend-search.patch"
          options=(-DGGML_RPC=ON -DGGML_RPC_RDMA=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release)
          if [[ "$BACKEND" == vulkan ]]; then options+=(-DGGML_VULKAN=ON); fi
          if [[ "$TARGET_OS" == linux && "$TARGET_ARCH" == arm64 ]]; then options+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DGGML_CPU_KLEIDIAI=ON); fi
          if [[ "$TARGET_OS" == darwin ]]; then options+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON); fi
          cmake -S upstream -B native "${options[@]}"
          cmake --build native --config Release --parallel 3 --target llama-server ggml-rpc-server
          mkdir -p stage/bin dist
          python3 scripts/stage-rpc-bundle.py native stage
          cp upstream/LICENSE stage/LICENSE.llama.cpp
          chmod -R u+rx stage/bin
          # Test the actual staged layout, not the CMake build tree.
          export LD_LIBRARY_PATH="$PWD/stage/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$PWD/stage/bin${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export PATH="$PWD/stage/bin:$PATH"
          suffix=""
          if [[ "$TARGET_OS" == windows ]]; then suffix=".exe"; fi
          stage/bin/llama-server"$suffix" --version 2>&1 | tee stage/native-capabilities.txt
          stage/bin/llama-server"$suffix" --list-devices 2>&1 | tee -a stage/native-capabilities.txt
          worker="stage/bin/ggml-rpc-server$suffix"
          if [[ ! -f "$worker" ]]; then worker="stage/bin/rpc-server$suffix"; fi
          "$worker" --help 2>&1 | tee -a stage/native-capabilities.txt
          python3 - <<'PY'
          import os, pathlib
          root=pathlib.Path("stage/bin")
          cpu=[p for p in root.iterdir() if p.is_file() and "ggml-cpu-" in p.name]
          assert len(cpu)>=2, "CPU variant modules missing"
          if os.environ.get("BACKEND") == "vulkan":
              assert any("ggml-vulkan" in p.name for p in root.iterdir() if p.is_file()), "Vulkan backend module missing"
          assert any(b"bounded parallel RPC tensor uploads enabled" in p.read_bytes() for p in root.iterdir() if p.is_file()), "RPC loader patch marker missing"
          PY
          archive="nodexlm-rpc_${version}_${TARGET_OS}_${TARGET_ARCH}_${BACKEND}.tar.gz"
          tar -czf "dist/$archive" -C stage bin LICENSE.llama.cpp native-capabilities.txt
          test "$(wc -c < "dist/$archive")" -le 419430400
          python3 - <<'PY'
          import hashlib,pathlib
          for p in pathlib.Path('dist').glob('*.tar.gz'):
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              (p.parent/(p.name+'.sha256')).write_text(digest+'  '+p.name+'\n')
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: go.mod, cache: false}
      - name: Software Vulkan driver for CI
        if: matrix.backend == 'vulkan' && matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
      - name: Native RPC end-to-end against the candidate bundle
        shell: bash
        env:
          GGML_METAL_DEVICES: 0
          NODEXLM_TEST_RPC_DEVICE: ${{ (matrix.os == 'darwin' || (matrix.os == 'windows' && matrix.backend == 'vulkan')) && 'CPU' || '' }}
          NODEXLM_TEST_GPU_LAYERS: ${{ (matrix.os == 'darwin' || (matrix.os == 'windows' && matrix.backend == 'vulkan')) && '0' || 'auto' }}
          NODEXLM_TEST_GUEST_COUNT: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' && matrix.backend == 'cpu' && '2' || '1' }}
          NODEXLM_TEST_DEVICE_MICROBENCH: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' && matrix.backend == 'cpu' && '1' || '0' }}
          NODEXLM_RPC_DIRECTIONAL_BENCH: '1'
          NODEXLM_PARALLEL_RPC_UPLOAD: '1'
          NODEXLM_RPC_DIR: ${{ github.workspace }}/stage
          NODEXLM_TEST_MODEL: ${{ github.workspace }}/tiny.gguf
        run: |
          curl -fsSL --retry 3 https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -o tiny.gguf
          python3 -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("tiny.gguf").read_bytes()).hexdigest()=="270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d"'
          go build -o nodexlm${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/nodexlm
          python3 scripts/e2e-rpc.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: {subject-path: 'dist/*.tar.gz'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rpc-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: dist/*
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: {path: dist, merge-multiple: true}
      - name: Publish immutable matching bundles
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          tag=$(python3 -c 'import json; r=json.load(open("internal/llamaruntime/revision.json")); print(r.get("rpc_candidate_release",r["rpc_release"]))')
          active=$(python3 -c 'import json; print(json.load(open("internal/llamaruntime/revision.json"))["rpc_release"])')
          [[ "$tag" != "$active" ]] || { echo "::error::Candidate must not overwrite the active runtime"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Immutable release already exists; do not overwrite reviewed binaries.'
            exit 0
          fi
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS.txt --target main --title "Pinned RPC b12255 with private Unix sockets" --notes "Matched b12255 RPC pairs built from $GITHUB_SHA; private Unix sockets plus bounded per-Guest parallel mmap tensor uploads and runtime-selected CPU variants. Six platform artifact attestations are available. Review and pin each SHA-256 before enabling downloads." --prerelease --latest=false
