name: Publish verified RPC artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rpc-publish.yml', 'internal/llamaruntime/rpc-build.json']
permissions: {contents: write, actions: read, attestations: read}
concurrency:
  group: nodexlm-rpc-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Verify existing immutable release before downloading old artifacts
        id: existing
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          current=json.loads(pathlib.Path('internal/llamaruntime/revision.json').read_text())
          tag=current['rpc_release']
          result=subprocess.run(['gh','api','repos/'+os.environ['GH_REPO']+'/releases/tags/'+tag],capture_output=True,text=True)
          if result.returncode:
              if '404' not in result.stderr:
                  raise RuntimeError(result.stderr)
              exists=False
          else:
              release=json.loads(result.stdout)
              assets={a['name']:a.get('digest') for a in release['assets']}
              for platform,digest in current['published'].items():
                  name='nodexlm-rpc_'+current['version']+'_'+platform.replace('/','_')+'.tar.gz'
                  assert assets.get(name)=='sha256:'+digest, 'Pinned hash mismatch: '+name
              exists=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('verified='+str(exists).lower()+'\n')
          PY
      - name: Verify approved build identity and six successful native jobs
        id: build
        if: steps.existing.outputs.verified != 'true'
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          build=json.loads(pathlib.Path('internal/llamaruntime/rpc-build.json').read_text())
          current=json.loads(pathlib.Path('internal/llamaruntime/revision.json').read_text())
          repo=os.environ['GH_REPO']
          get=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+repo+path]))
          run=get('/actions/runs/'+str(build['run_id']))
          assert run['head_sha']==build['commit'] and run['head_repository']['full_name']==repo
          assert run['path']=='.github/workflows/rpc-platforms.yml'
          jobs=get('/actions/runs/'+str(build['run_id'])+'/jobs?per_page=100')['jobs']
          native=[j for j in jobs if j['name'].startswith('build (')]
          assert len(native)==len(current['published']) and len(native)>=6 and all(j['conclusion']=='success' for j in native)
          # Publish from current main only while its pinned native source/patch
          # still matches the build. The release notes retain the build SHA.
          subprocess.run(['git','fetch','--depth=1','origin',build['commit']],check=True)
          for file in [
              'internal/llamaruntime/patches/unix-rpc.patch',
              'internal/llamaruntime/patches/arm32-rpc-wire.patch',
              'internal/llamaruntime/patches/parallel-rpc-loader.patch',
              'internal/llamaruntime/patches/rpc-command-batching.patch',
              'scripts/optimized-rpc-backend-search.patch',
          ]:
              assert subprocess.check_output(['git','show',build['commit']+':'+file])==pathlib.Path(file).read_bytes()
          before=json.loads(subprocess.check_output(['git','show',build['commit']+':internal/llamaruntime/revision.json']))
          assert current["rpc_release"] == build["tag"], "Old artifact tag cannot publish a new runtime revision"
          assert before['commit']==current['commit'] and before['version']==current['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(build['run_id'])+'\n')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.existing.outputs.verified != 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run }}
          pattern: rpc-*
          path: dist
          merge-multiple: true
      - name: Publish immutable bundles
        if: steps.existing.outputs.verified != 'true'
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -euo pipefail
          expected_count=$(python3 -c 'import json;print(len(json.load(open("internal/llamaruntime/revision.json"))["published"]))')
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq "$expected_count"
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("dist")
          pinned = json.loads(pathlib.Path("internal/llamaruntime/revision.json").read_text())
          expected = pinned["published"]
          assert len(expected) == 6
          seen = set()
          for platform, digest in expected.items():
              name = "nodexlm-rpc_" + pinned["version"] + "_" + platform.replace("/", "_") + ".tar.gz"
              path = root / name
              assert path.is_file() and path.stat().st_size <= 419430400, name
              with path.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              assert actual == digest, "Pinned artifact digest mismatch: " + name
              seen.add(name)
          assert {p.name for p in root.glob("*.tar.gz")} == seen, "Unexpected native archives"
          PY
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/rpc-platforms.yml"
          done
          tag=$(python3 -c 'import json;print(json.load(open("internal/llamaruntime/rpc-build.json"))["tag"])')
          build=$(python3 -c 'import json;print(json.load(open("internal/llamaruntime/rpc-build.json"))["commit"])')
          cp internal/llamaruntime/rpc-build.json dist/BUILD.json
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Immutable release already exists; no assets overwritten.'
            exit 0
          fi
          # GitHub restricts GITHUB_TOKEN tag creation at non-head commits.
          # The native source equality above and provenance retain build identity.
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS.txt dist/BUILD.json --target main --title "Pinned RPC ${tag} with private Unix sockets" --notes "Native artifacts built from $build; source revision and Unix patch verified unchanged. Six platform builds and Linux native Unix E2E passed. Artifact attestations bind each binary to its build." --prerelease --latest=false
